services:
  storefront:
    build:
      context: .
      dockerfile: integration-magento/Dockerfile
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      # Middleware
      API_PORT: "4000"
      MAGENTO_GRAPHQL_ENDPOINT: "https://www.ahmedelsallab.com/graphql"
      MAGENTO_STORE_CODE: "ar"
      # Storefront -> middleware
      NUXT_PUBLIC_MIDDLEWARE_URL: "http://localhost:4000/magento"

